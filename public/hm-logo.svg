<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="HM — Harussani Manaphassan">
  <title>HM — Harussani Manaphassan</title>
  <desc>Logo mark for Harussani Manaphassan — Head of Creative &amp; Brand Systems Architect</desc>

  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="#020617"/>

  <!-- H letterform (stroke weight 10px) -->
  <rect x="8"  y="21" width="10" height="58" fill="white"/>
  <rect x="36" y="21" width="10" height="58" fill="white"/>
  <rect x="8"  y="41" width="38" height="10" fill="white"/>

  <!--
    M letterform — classic diagonal M using evenodd fill rule.
    Outer polygon  : full letter shape including V-space
    Inner polygon  : punches out the two V-shaped inner voids
    Left bar       : x 52–62  (10 px)
    Right bar      : x 80–90  (10 px)
    Centre peak    : outer (71,51)  inner (71,57)
  -->
  <path fill-rule="evenodd" fill="white" d="
    M 52,79 L 52,21 L 71,51 L 90,21 L 90,79 Z
    M 62,79 L 80,79 L 80,27 L 71,57 L 62,27 Z
  "/>
</svg>
