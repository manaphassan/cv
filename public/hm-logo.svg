<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-label="hm — Harussani Manaphassan">
  <title>hm — Harussani Manaphassan</title>

  <style>
    :root { --bg:#F5F0EA; --border:#C2BAB0; --ink:#0D0D0D; }
    @media (prefers-color-scheme:dark) {
      :root { --bg:#0D0D0D; --border:#2A2A2A; --ink:#EDE8E1; }
    }
  </style>

  <!-- Paper / e-ink background -->
  <rect width="100" height="100" rx="22" fill="var(--bg)"/>
  <!-- Editorial border frame -->
  <rect x="2.5" y="2.5" width="95" height="95" rx="20" fill="none"
        stroke="var(--border)" stroke-width="1.2"/>

  <!--
    hm Rounded Bold — primary logo
    ───────────────────────────────
    3 bars:
      Bar 1  x=15–31 (16 px)  h ascender — tall, ROUNDED TOP cap r=8
      Bar 2  x=42–58 (16 px)  shared h·right / m·left
      Bar 3  x=69–85 (16 px)  m right

    2 arches (r=5.5, sweep upward):
      h arch  (31,36) → peak y≈30.5 → (42,36)
      m arch  (58,36) → peak y≈30.5 → (69,36)

    Bar 1 rounded cap:
      left side rises to y=20, then A 8,8,0,0,0 curves to (31,20)
      peaking at (23,12)
  -->
  <path fill="var(--ink)" d="
    M 15,84
    L 15,20
    A 8,8,0,0,0 31,20
    L 31,36
    A 5.5,5.5,0,0,0 42,36
    L 58,36
    A 5.5,5.5,0,0,0 69,36
    L 85,36
    L 85,84
    Z
  "/>
</svg>
