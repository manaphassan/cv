<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Harussani Manaphassan — Head of Creative &amp; Brand Systems Architect">
  <title>Harussani Manaphassan — Portfolio &amp; CV</title>

  <!-- Background -->
  <rect width="1200" height="630" fill="#020617"/>

  <!-- Subtle dot grid for depth -->
  <defs>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="white" opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Left panel: HM logo marks (no background rect — blends with page bg) -->
  <!-- translate(84,165) scale(3) centres marks at (231,315) in 460×630 panel -->
  <g transform="translate(84,165) scale(3)" fill="white">
    <!-- H -->
    <rect x="8"  y="21" width="10" height="58"/>
    <rect x="36" y="21" width="10" height="58"/>
    <rect x="8"  y="41" width="38" height="10"/>
    <!-- M (classic diagonal, evenodd) -->
    <path fill-rule="evenodd" d="M 52,79 L 52,21 L 71,51 L 90,21 L 90,79 Z M 62,79 L 80,79 L 80,27 L 71,57 L 62,27 Z"/>
  </g>

  <!-- Vertical divider -->
  <line x1="460" y1="60" x2="460" y2="570" stroke="white" stroke-width="1" opacity="0.1"/>

  <!-- Editorial tag -->
  <text x="520" y="195"
    font-family="'Courier New',Courier,monospace"
    font-size="16" font-weight="700" letter-spacing="3"
    fill="#808080" text-anchor="start">
    [HEAD OF CREATIVE · BRAND SYSTEMS ARCHITECT]
  </text>

  <!-- Name — two lines for impact -->
  <text x="520" y="275"
    font-family="system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"
    font-size="72" font-weight="800" letter-spacing="-2"
    fill="white" text-anchor="start">
    Harussani
  </text>
  <text x="520" y="358"
    font-family="system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"
    font-size="72" font-weight="800" letter-spacing="-2"
    fill="white" text-anchor="start">
    Manaphassan
  </text>

  <!-- Thin separator -->
  <line x1="520" y1="385" x2="1140" y2="385" stroke="white" stroke-width="1" opacity="0.15"/>

  <!-- Company -->
  <text x="520" y="425"
    font-family="'Courier New',Courier,monospace"
    font-size="22" font-weight="600"
    fill="#A2A2A2" text-anchor="start">
    Suamisihat Holding · Appcable
  </text>

  <!-- Location -->
  <text x="520" y="460"
    font-family="'Courier New',Courier,monospace"
    font-size="19"
    fill="#646464" text-anchor="start">
    Shah Alam, Selangor, Malaysia
  </text>

  <!-- Bottom separator -->
  <line x1="520" y1="490" x2="1140" y2="490" stroke="white" stroke-width="1" opacity="0.1"/>

  <!-- Portfolio URL with green availability dot -->
  <circle cx="525" cy="526" r="5" fill="#34D399"/>
  <text x="542" y="531"
    font-family="'Courier New',Courier,monospace"
    font-size="21" font-weight="600"
    fill="#A2A2A2" text-anchor="start">
    manaphassan.github.io/cv
  </text>
</svg>
