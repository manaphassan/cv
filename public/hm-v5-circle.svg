<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-label="hm — Circle Badge">
  <title>hm — Circle Badge</title>
  <style>
    :root { --bg:#F5F0EA; --border:#C2BAB0; --ink:#0D0D0D; }
    @media (prefers-color-scheme:dark) {
      :root { --bg:#0D0D0D; --border:#2A2A2A; --ink:#EDE8E1; }
    }
  </style>
  <!-- Circle container (perfect circle — Instagram / social media icon) -->
  <circle cx="50" cy="50" r="48" fill="var(--bg)"/>
  <circle cx="50" cy="50" r="45.5" fill="none" stroke="var(--border)" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="43"   fill="none" stroke="var(--border)" stroke-width="0.4"/>
  <!--
    V5: Circle Badge
    Same base letterform geometry as hm-logo.svg
    Placed inside a perfect circle — ideal for profile pictures,
    Instagram, WhatsApp DP, app icons
  -->
  <path fill="var(--ink)" d="
    M 15,84
    L 15,12
    L 30,12
    L 30,36
    A 6.5,6.5,0,0,0 43,36
    L 58,36
    A 6.5,6.5,0,0,0 71,36
    L 86,36
    L 86,84
    Z
  "/>
</svg>
