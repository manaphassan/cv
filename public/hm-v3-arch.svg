<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-label="hm — Arch Premiere">
  <title>hm — Arch Premiere</title>
  <style>
    :root { --bg:#F5F0EA; --border:#C2BAB0; --ink:#0D0D0D; }
    @media (prefers-color-scheme:dark) {
      :root { --bg:#0D0D0D; --border:#2A2A2A; --ink:#EDE8E1; }
    }
  </style>
  <rect width="100" height="100" rx="20" fill="var(--bg)"/>
  <rect x="2.5" y="2.5" width="95" height="95" rx="18" fill="none" stroke="var(--border)" stroke-width="1.2"/>
  <!--
    V3: Arch Premiere
    Wide 22px gaps → arches as tall as bars are wide
    Bar width 14px · Gap 22px · Arch radius 11
    Bar 1: x=7–21  Bar 2: x=43–57  Bar 3: x=79–93
    Arch peak at y=25 — dominates the composition
  -->
  <path fill="var(--ink)" d="
    M 7,86
    L 7,10
    L 21,10
    L 21,36
    A 11,11,0,0,0 43,36
    L 57,36
    A 11,11,0,0,0 79,36
    L 93,36
    L 93,86
    Z
  "/>
</svg>
