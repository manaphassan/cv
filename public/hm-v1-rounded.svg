<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-label="hm — Rounded Bold">
  <title>hm — Rounded Bold</title>
  <style>
    :root { --bg:#F5F0EA; --border:#C2BAB0; --ink:#0D0D0D; }
    @media (prefers-color-scheme:dark) {
      :root { --bg:#0D0D0D; --border:#2A2A2A; --ink:#EDE8E1; }
    }
  </style>
  <rect width="100" height="100" rx="22" fill="var(--bg)"/>
  <rect x="2.5" y="2.5" width="95" height="95" rx="20" fill="none" stroke="var(--border)" stroke-width="1.2"/>
  <!--
    V1: Rounded Bold
    Bar width 16px · Gap 11px · Rounded cap on bar 1 top
    Bar 1: x=15–31  Bar 2: x=42–58  Bar 3: x=69–85
    Arch radius 5.5  ·  Bar 1 cap radius 8
  -->
  <path fill="var(--ink)" d="
    M 15,84
    L 15,20
    A 8,8,0,0,0 31,20
    L 31,36
    A 5.5,5.5,0,0,0 42,36
    L 58,36
    A 5.5,5.5,0,0,0 69,36
    L 85,36
    L 85,84
    Z
  "/>
</svg>
