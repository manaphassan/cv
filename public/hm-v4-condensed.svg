<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-label="hm — Condensed">
  <title>hm — Condensed</title>
  <style>
    :root { --bg:#F5F0EA; --border:#C2BAB0; --ink:#0D0D0D; }
    @media (prefers-color-scheme:dark) {
      :root { --bg:#0D0D0D; --border:#2A2A2A; --ink:#EDE8E1; }
    }
  </style>
  <rect width="100" height="100" rx="20" fill="var(--bg)"/>
  <rect x="2.5" y="2.5" width="95" height="95" rx="18" fill="none" stroke="var(--border)" stroke-width="1.2"/>
  <!--
    V4: Condensed
    Very tall, narrow bars — architectural / compressed
    Bar width 12px · Gap 10px · Very tall ascender (y=6)
    Bar 1: x=22–34  Bar 2: x=44–56  Bar 3: x=66–78
    Bars tightly spaced, h ascender towers above m x-height
  -->
  <path fill="var(--ink)" d="
    M 22,88
    L 22,6
    L 34,6
    L 34,36
    A 5,5,0,0,0 44,36
    L 56,36
    A 5,5,0,0,0 66,36
    L 78,36
    L 78,88
    Z
  "/>
</svg>
